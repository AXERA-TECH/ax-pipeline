name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ax650
            script: ./build_ax650.sh
          - chip: ax630c
            script: ./build_ax630c.sh
          - chip: ax620q
            script: ./build_ax620q.sh
          - chip: ax620qp
            script: ./build_ax620qp.sh
          - chip: axcl-x86_64
            script: ./build_axcl_x86.sh
          - chip: axcl-aarch64
            script: ./build_axcl_aarch64.sh
          - chip: axcl-riscv64
            script: ./build_axcl_riscv64.sh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache CI Assets
        uses: actions/cache@v4
        with:
          path: |
            .ci/downloads
            .ci/toolchains
            .ci/msp
            .ci/axcl
          key: ${{ runner.os }}-${{ matrix.chip }}-${{ hashFiles('.github/workflows/build.yml', 'scripts/build_common.sh', 'toolchains/*.cmake') }}

      - name: Build (${{ matrix.chip }})
        run: |
          chmod +x ./build_ax650.sh ./build_ax630c.sh ./build_ax620q.sh ./build_ax620qp.sh ./build_axcl_x86.sh ./build_axcl_aarch64.sh ./build_axcl_riscv64.sh ./scripts/build_common.sh
          ${{ matrix.script }}

      # Actions artifacts storage is full, so publish the per-chip tarball to a single
      # fixed-tag prerelease instead, overwriting the previous asset on every push to main.
      - name: Publish build to rolling CI release (${{ matrix.chip }})
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ci-latest
        run: |
          # Create the rolling release once; ignore "already exists" (races between matrix jobs).
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "CI latest build" \
              --notes "Rolling CI build output, overwritten on every push to main." || true
          # Each chip uploads ax_pipeline_<chip>.tar.gz (distinct names), --clobber overwrites last run.
          gh release upload "$TAG" artifacts/${{ matrix.chip }}/*.tar.gz --clobber
